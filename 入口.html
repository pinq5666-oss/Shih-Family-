<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120e">
<title>石氏家譜｜入口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ead8;--ink:#211912;--gold:#c49a50;--gold2:#f0d39a;--muted:#c4b397;--line:#816944}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17120e;color:var(--paper);font-family:"Noto Serif TC",serif}
body{overflow:hidden}.scene{min-height:100svh;display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 38%,#493521 0,#261b13 33%,#17120e 75%)}
.scene:before{content:"";position:absolute;inset:0;opacity:.22;background-image:linear-gradient(115deg,transparent 0 49%,#c49a5014 50% 50.2%,transparent 50.4%),linear-gradient(65deg,transparent 0 49%,#c49a5010 50% 50.2%,transparent 50.4%);background-size:90px 90px;z-index:-1}
.glow{position:absolute;width:min(72vw,720px);height:min(72vw,720px);border:1px solid #c49a502b;border-radius:50%;box-shadow:0 0 100px #c49a5015,inset 0 0 80px #c49a5010}
.glow:before,.glow:after{content:"";position:absolute;inset:8%;border:1px solid #c49a501e;border-radius:50%}.glow:after{inset:20%;border-style:dashed;animation:spin 45s linear infinite}
.panel{width:min(92vw,760px);padding:clamp(42px,8vw,82px) 28px;text-align:center;position:relative}.crest{width:92px;height:92px;margin:0 auto 26px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:38px;position:relative;box-shadow:0 0 0 8px #c49a5010,0 0 35px #c49a5020}.crest:before,.crest:after{content:"";position:absolute;width:18px;height:1px;background:var(--gold);left:-27px;top:50%}.crest:after{left:auto;right:-27px}
.kicker{font-size:12px;letter-spacing:.5em;color:var(--gold);margin-left:.5em}.title{margin:20px 0 10px;font-size:clamp(34px,8vw,68px);font-weight:600;letter-spacing:.3em;margin-right:-.3em;color:#fff4df;text-shadow:0 3px 24px #000}.subtitle{margin:0;color:var(--muted);letter-spacing:.28em;font-size:12px;margin-right:-.28em}.rule{width:110px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:30px auto}
.enter{appearance:none;border:1px solid var(--gold);background:linear-gradient(135deg,#b98b43,#d9b66f);color:#24180d;padding:13px 34px;border-radius:999px;font:600 15px "Noto Serif TC",serif;letter-spacing:.25em;cursor:pointer;box-shadow:0 8px 28px #0007,0 0 0 5px #c49a5010;transition:transform .25s,box-shadow .25s}.enter:hover,.enter:focus-visible{transform:translateY(-3px);box-shadow:0 12px 34px #0009,0 0 0 8px #c49a5018;outline:none}.hint{margin-top:24px;color:#95836a;font-size:11px;letter-spacing:.12em}
.fade{animation:fade 1.1s ease both}.delay1{animation-delay:.15s}.delay2{animation-delay:.3s}.delay3{animation-delay:.45s}@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="scene" aria-labelledby="title">
  <div class="glow" aria-hidden="true"></div>
  <section class="panel">
    <div class="crest fade">石</div>
    <div class="kicker fade delay1">THE SHIH FAMILY GENEALOGY</div>
    <h1 id="title" class="title fade delay1">石氏家譜</h1>
    <p class="subtitle fade delay2">敬祖 · 承脈 · 傳家</p>
    <div class="rule fade delay2"></div>
    <button class="enter fade delay3" type="button" id="enter">進入家譜</button>
    <p class="hint fade delay3">點擊後開啟正式家譜內容</p>
  </section>
</main>
<script>
const target='石氏家譜.html';
document.querySelector('#enter').addEventListener('click',()=>{document.body.style.transition='opacity .55s ease';document.body.style.opacity='0';setTimeout(()=>{location.href=target},550)});
document.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#enter').click()});
</script>
</body>
</html>
